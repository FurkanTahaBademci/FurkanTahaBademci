name: Contribution Games

on:
  schedule:
    # every day at 02:30 UTC, just before the README refresh
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-games
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Play Pac-Man on the contribution grid
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      # The snake action writes into dist/ as well, so keep the arcade output
      # somewhere safe until both games are done.
      - name: Stash the arcade output
        run: |
          mkdir -p games
          cp dist/*.svg games/ 2>/dev/null || echo "no arcade output produced"
          ls -la dist games

      - name: Eat the contribution grid as a snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Merge both games, under stable file names
        run: |
          cp games/*.svg dist/ 2>/dev/null || true
          for f in dist/*pacman*.svg; do
            [ -e "$f" ] && cp "$f" dist/pacman.svg && break
          done
          ls -la dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
