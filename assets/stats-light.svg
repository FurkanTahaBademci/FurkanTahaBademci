<svg width="495" height="240" viewBox="0 0 495 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Furkan Taha Bademci · GitHub Stats">
  <style>
    .title { font: 600 18px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #0969da; }
    .label { font: 400 14px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #1f2328; }
    .value { font: 700 14px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #1f2328; }
    .muted { font: 400 11px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; fill: #59636e; }
    .row { opacity: 0; animation: fade 0.5s ease-in-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
  </style>
  <rect x="0.5" y="0.5" rx="10" width="494" height="239" fill="#ffffff" stroke="#d0d7de"/>
  <text x="25" y="35" class="title">Furkan Taha Bademci · GitHub Stats</text>
  <g class="row" style="animation-delay:0.15s">
    <text x="25" y="68" class="label">⭐  Total Stars Earned</text>
    <text x="465" y="68" class="value" text-anchor="end">8</text>
  </g>
  <g class="row" style="animation-delay:0.25s">
    <text x="25" y="98" class="label">🧬  Commits (all time)</text>
    <text x="465" y="98" class="value" text-anchor="end">350</text>
  </g>
  <g class="row" style="animation-delay:0.35s">
    <text x="25" y="128" class="label">📦  Public Repositories</text>
    <text x="465" y="128" class="value" text-anchor="end">36</text>
  </g>
  <g class="row" style="animation-delay:0.45s">
    <text x="25" y="158" class="label">🔱  Forks of My Repos</text>
    <text x="465" y="158" class="value" text-anchor="end">1</text>
  </g>
  <g class="row" style="animation-delay:0.55s">
    <text x="25" y="188" class="label">👥  Followers</text>
    <text x="465" y="188" class="value" text-anchor="end">29</text>
  </g>
  <text x="25" y="222" class="muted">Generated automatically from the GitHub API</text>
</svg>
